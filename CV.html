<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CV | Holzen Martínez</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #eef1f5;
            color: #263238;
            line-height: 1.6;
        }

        .cv {
            max-width: 1100px;
            margin: 35px auto;
            background: white;
            display: grid;
            grid-template-columns: 310px 1fr;
            box-shadow: 0 10px 35px rgba(0,0,0,.12);
        }
